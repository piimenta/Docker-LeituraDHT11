# 1. O que o Telegraf vai escutar? (Input)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensores/arduino"]
  data_format = "influx"

# 2. Para onde o Telegraf vai mandar? (Output)
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"